<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weizend Mağaza</title>
    <style>
        /* WEIZEND RENK PALETİ VE TASARIM AYARLARI */
        :root {
            --bg-color: #050505; 
            --card-bg: #111111; 
            --border-color: #2a2a2a; 
            --weizend-red: #e31b1b; 
            --weizend-white: #ffffff;
            --text-muted: #a0a0a0;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--weizend-white); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Header & Kategori */
        header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--border-color); margin-bottom: 30px; }
        .logo-img { width: 120px; border-radius: 50%; box-shadow: 0 0 20px rgba(227, 27, 27, 0.4); margin-bottom: 15px; }
        header h1 { margin: 0; font-size: 2.2rem; color: var(--weizend-white); text-transform: uppercase; letter-spacing: 2px; }
        .ig-contact { display: inline-block; margin-top: 10px; padding: 8px 15px; background: rgba(227, 27, 27, 0.1); border: 1px solid var(--weizend-red); border-radius: 20px; color: var(--weizend-red); text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        
        .category-filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--weizend-white); padding: 8px 20px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .filter-btn.active, .filter-btn:hover { background: var(--weizend-red); border-color: var(--weizend-red); }

        /* Ürün Grid ve Kartlar */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--weizend-red); transform: translateY(-5px); box-shadow: 0 5px 20px rgba(227, 27, 27, 0.15); }
        
        /* Resim Alanı & Büyütme Tıklaması */
        .img-container { width: 100%; height: 280px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; position: relative; border: 1px solid var(--border-color); cursor: pointer; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; transition: 0.3s; }
        .img-container:hover img { transform: scale(1.03); }
        .category-badge { position: absolute; top: 10px; right: 10px; background: var(--weizend-red); color: white; padding: 4px 10px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; z-index: 2; }
        
        /* Stok ve Tükenmişlik Etiketleri */
        .stock-wrapper { margin-bottom: 15px; }
        .stock-badge { display: inline-block; background: rgba(0,0,0,0.8); border: 1px solid var(--weizend-red); color: var(--weizend-white); padding: 4px 10px; font-size: 0.8rem; font-weight: bold; border-radius: 4px; }
        .stock-info-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-style: italic; }

        .out-of-stock-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 3; }
        .out-of-stock-text { background: var(--weizend-red); color: white; padding: 8px 20px; font-weight: bold; border-radius: 6px; font-size: 1.1rem; letter-spacing: 1px; }

        .zoom-hint { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--weizend-red); color: white; padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; opacity: 0; transition: 0.3s; pointer-events: none; }
        .img-container:hover .zoom-hint { opacity: 1; }

        /* Kart İçi Küçük Görseller (Thumbnails) */
        .card-thumbnails { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .card-thumbnails::-webkit-scrollbar { display: none; }
        .card-thumb { width: 55px; height: 55px; object-fit: contain; border-radius: 6px; border: 2px solid #222; cursor: pointer; opacity: 0.5; transition: 0.2s; background: #000; flex-shrink: 0; }
        .card-thumb:hover { opacity: 1; }
        .card-thumb.active { border-color: var(--weizend-red); opacity: 1; }

        /* Ürün Bilgileri */
        .product-title { margin: 0 0 10px 0; font-size: 1.3rem; }
        .price-command { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .price { color: var(--weizend-red); font-weight: bold; font-size: 1.1rem; }
        .command { background: #000; border: 1px dashed var(--weizend-red); padding: 5px 10px; border-radius: 4px; color: var(--weizend-red); font-family: monospace; }
        .command.disabled { border-color: #555; color: #772ce8; text-decoration: line-through; }

        /* İşlem Yap Butonu */
        .action-btn { width: 100%; background: var(--weizend-red); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(227, 27, 27, 0.3); }
        .action-btn:hover { background: #c21414; transform: translateY(-2px); }
        .action-btn.disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; transform: none; }

        /* Açılır Kutular (Accordion) */
        details { background: #1a1a1a; border-radius: 6px; margin-bottom: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        summary { padding: 12px 15px; cursor: pointer; font-weight: 600; color: var(--weizend-white); outline: none; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '+'; color: var(--weizend-red); font-weight: bold; font-size: 1.2rem; }
        details[open] summary::after { content: '-'; }
        .details-content { padding: 15px; background: var(--card-bg); font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border-color); }
        
        .details-content ul { margin: 0; padding-left: 20px; }
        .details-content li { margin-bottom: 6px; }

        /* MODAL (AÇILIR GALERİ) TASARIMI */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 600px; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; }
        
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .close-icon { background: none; border: none; color: var(--weizend-white); font-size: 1.5rem; cursor: pointer; transition: 0.2s; line-height: 1; }
        .close-icon:hover { color: var(--weizend-red); }

        .modal-body { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-slider { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .main-slider img { width: 100%; max-height: 350px; object-fit: contain; border-radius: 8px; }
        
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--weizend-red); width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; z-index: 5; }
        .nav-btn:hover { background: var(--weizend-red); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        .thumbnail-list { display: flex; gap: 10px; justify-content: center; overflow-x: auto; padding-bottom: 5px; width: 100%; }
        .modal-thumb { width: 70px; height: 70px; object-fit: contain; border: 2px solid #222; border-radius: 6px; cursor: pointer; transition: 0.2s; opacity: 0.5; background: #000; }
        .modal-thumb:hover { opacity: 1; }
        .modal-thumb.active { border-color: var(--weizend-red); opacity: 1; }

        /* SATIN ALMA YÖNLENDİRME MODALI */
        .redirect-modal-body { padding: 30px; text-align: center; }
        .redirect-command-box { background: #000; border: 2px dashed var(--weizend-red); padding: 15px; border-radius: 8px; font-size: 1.4rem; color: var(--weizend-red); font-family: monospace; margin: 20px 0; font-weight: bold; }
        .redirect-timer { color: var(--weizend-white); font-size: 1rem; margin-top: 15px; }
        .cancel-btn { background: #222; color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 20px; width: 100%; }
        .cancel-btn:hover { background: #333; color: white; }
    </style>
</head>
<body>

    <script>
        // ÜRÜNLERİ BURAYA EKLİYORSUN
        const URUNLER = [
            {
                durum: "on", 
                stok: 10,    
                kategori: "Fiziksel Ürün",
                ad: "Kapüşonlu Kanguru Cepli Siyah Sweatshirt",
                puan: "350.000 Puan",
                komut: "!sweatshirt",

            {

                stok: 100,
                kategori: "Turnuva",

                komut: "!turnuva",

                ],
                ozellikler: `
                    <ul>

                        <li>Turnuva kuralları ve eşleşmeler Discord sunucumuzdan duyurulacaktır.</li>

        URUNLER.forEach((urun, index) => urun.orijinalId = index);
    </script>

    <div class="container">
        <header>
            <img src="https://i.hizliresim.com/fo5evkh4.png" alt="Weizend Logo" class="logo-img">
            <h1>WEİZEND MAĞAZA</h1>
            <p style="color: var(--text-muted);">Yayını izleyerek biriktirdiğin puanlarla ödülleri kap!</p>
            <a href="https://instagram.com/weizendtv" target="_blank" class="ig-contact">📸 İletişim: @weizendtv</a>
        </header>

        <div class="category-filters" id="filters">
            <button class="filter-btn active" onclick="filtrele('Tümü')">Tümü</button>
            <button class="filter-btn" onclick="filtrele('Fiziksel Ürün')">Fiziksel Ürün</button>
            <button class="filter-btn" onclick="filtrele('Dijital Kod')">Dijital Kod</button>
            <button class="filter-btn" onclick="filtrele('Turnuva')">Turnuva</button>
        </div>

        <div class="grid" id="urunGrid">
            <!-- Ürünler buraya yüklenecek -->
        </div>
    </div>

    <!-- MODAL 1: GÖRSEL BÜYÜTME GALERİSİ -->
    <div id="imageModal" class="modal-overlay" onclick="disariTiklaKapat(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tasarım Önizleme</h3>
                <button class="close-icon" onclick="modaliKapat()">✖</button>
            </div>
            
            <div class="modal-body">
                <div class="main-slider">
                    <button class="nav-btn prev-btn" id="prevBtn" onclick="oncekiResim(event)">❮</button>
                    <img id="modalMainImg" src="" alt="Önizleme">
                    <button class="nav-btn next-btn" id="nextBtn" onclick="sonrakiResim(event)">❯</button>
                </div>
                <div class="thumbnail-list" id="modalThumbnails"></div>
            </div>
        </div>
    </div>

    <!-- MODAL 2: KICK SOHBET YÖNLENDİRME PENCERESİ -->
    <div id="redirectModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h3>Sipariş Onayı</h3>
                <button class="close-icon" onclick="yonlendirmeyiIptalEt()">✖</button>
            </div>
            <div class="redirect-modal-body">
                <p style="color: #fff; margin: 0; font-size: 1.05rem;">Komut kopyalandı, Kick sohbete yönlendiriliyorsunuz:</p>
                <div class="redirect-command-box" id="modalCommandText">!komut</div>
                <div class="redirect-timer" id="timerText">5 saniye içinde yönlendirileceksiniz...</div>
                <button class="cancel-btn" onclick="yonlendirmeyiIptalEt()">İptal Et</button>
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('urunGrid');
        
        let aktifGorselListesi = [];
        let aktifResimIndex = 0;
        let redirectTimer = null;

        function urunleriYukle(filtreKategori) {
            grid.innerHTML = ''; 
            
            let gosterilecekUrunler = URUNLER.filter(urun => urun.durum === "on" && (filtreKategori === 'Tümü' || urun.kategori === filtreKategori));

            gosterilecekUrunler.sort((a, b) => {
                let puanA = parseInt(a.puan.replace(/[^0-9]/g, ''));
                let puanB = parseInt(b.puan.replace(/[^0-9]/g, ''));
                return puanA - puanB;
            });
            
            gosterilecekUrunler.forEach(urun => {
                const ilkGorsel = urun.gorseller[0];
                const tukendiMi = urun.stok <= 0;

                let thumbnailsHTML = '';
                if (urun.gorseller.length > 1) {
                    thumbnailsHTML = '<div class="card-thumbnails">';
                    urun.gorseller.forEach((url, i) => {
                        const aktifClass = i === 0 ? 'active' : '';
                        thumbnailsHTML += `<img src="${url}" class="card-thumb ${aktifClass}" onclick="kartIciResimDegistir(event, this, ${urun.orijinalId}, ${i}, '${url}')">`;
                    });
                    thumbnailsHTML += '</div>';
                }

                // Stok alanı ve bilgilendirmesi
                let stokAlaniHTML = `
                    <div class="stock-wrapper">
                        <span class="stock-badge">Stok: ${urun.stok}</span>
                        <div class="stock-info-text">İşlem onaylandıktan sonra stok bilgisi güncellenmektedir.</div>
                    </div>
                `;
                let tukendiOverlayHTML = '';
                if (tukendiMi) {
                    stokAlaniHTML = `
                        <div class="stock-wrapper">
                            <span class="stock-badge" style="background:var(--weizend-red);">Tükendi</span>
                            <div class="stock-info-text">İşlem onaylandıktan sonra stok bilgisi güncellenmektedir.</div>
                        </div>
                    `;
                    tukendiOverlayHTML = `<div class="out-of-stock-overlay"><div class="out-of-stock-text">TÜKENDİ</div></div>`;
                }

                // DİNAMİK TESLİMAT BİLGİSİ
                let teslimatKutusuHTML = '';
                if (urun.kategori === 'Fiziksel Ürün') {
                    const yazi = `Ürünü Kick sohbetimizden <b><span style="color:var(--weizend-red);">${urun.komut}</span></b> yazıp aldıktan sonra İnstagram <b><a href="https://instagram.com/weizendtv" target="_blank" style="color:var(--weizend-red);">@weizendtv</a></b> adresine mesaj atarak teslimat işlemlerini halledebilirsiniz.<br><br><b>🚚 Ne Zaman Kargolanır?</b><br>En geç 5 iş gününde kargoda. Tüm ürünlerde kargo ücreti bize aittir.`;
                    teslimatKutusuHTML = `<details><summary>Teslimat ve Kargo Bilgileri</summary><div class="details-content">${yazi}</div></details>`;
                } 
                else if (urun.kategori === 'Dijital Kod') {
                    const yazi = `Ürünü Kick sohbetimizden <b><span style="color:var(--weizend-red);">${urun.komut}</span></b> yazıp aldıktan sonra Discord üzerinden yetkililere mesaj atarak veya İnstagram <b><a href="https://instagram.com/weizendtv" target="_blank" style="color:var(--weizend-red);">@weizendtv</a></b> adresine ulaşarak dijital kodunuzu anında teslim alabilirsiniz.`;
                    teslimatKutusuHTML = `<details><summary>Teslimat Bilgileri</summary><div class="details-content">${yazi}</div></details>`;
                }

                const komutClass = tukendiMi ? "command disabled" : "command";
                const actionBtnClass = tukendiMi ? "action-btn disabled" : "action-btn";
                const actionBtnText = tukendiMi ? "TÜKENDİ" : "İşlem Yap";
                const actionBtnClick = tukendiMi ? "" : `onclick="islemYapBaslat('${urun.komut}')"`;

                const kart = `
                    <div class="card">
                        <div class="img-container" data-current-index="0" onclick="modaliAc(${urun.orijinalId}, this.dataset.currentIndex)">
                            <span class="category-badge">${urun.kategori}</span>
                            ${tukendiOverlayHTML}
                            <img class="main-card-img" src="${ilkGorsel}" alt="${urun.ad}">
                            <div class="zoom-hint">🔍 Büyüt</div>
                        </div>
                        
                        ${thumbnailsHTML}

                        <h3 class="product-title">${urun.ad}</h3>
                        
                        ${stokAlaniHTML}

                        <div class="price-command">
                            <span class="price">${urun.puan}</span>
                            <span class="${komutClass}">${tukendiMi ? 'TÜKENDİ' : urun.komut}</span>
                        </div>

                        <button class="${actionBtnClass}" ${actionBtnClick}>${actionBtnText}</button>

                        <details>
                            <summary>Detaylar</summary>
                            <div class="details-content">${urun.ozellikler}</div>
                        </details>
                        
                        ${teslimatKutusuHTML}
                    </div>
                `;
                grid.innerHTML += kart;
            });
        }

        // --- İŞLEM YAP & KİCK YÖNLENDİRME FONKSİYONLARI ---
        function islemYapBaslat(komut) {
            // Panoya kopyala
            navigator.clipboard.writeText(komut).catch(() => {});

            document.getElementById('modalCommandText').innerText = komut;
            document.getElementById('redirectModal').style.display = 'flex';

            let kalanSaniye = 5;
            document.getElementById('timerText').innerText = `${kalanSaniye} saniye içinde yönlendirileceksiniz...`;

            if(redirectTimer) clearInterval(redirectTimer);

            redirectTimer = setInterval(() => {
                kalanSaniye--;
                if (kalanSaniye > 0) {
                    document.getElementById('timerText').innerText = `${kalanSaniye} saniye içinde yönlendirileceksiniz...`;
                } else {
                    clearInterval(redirectTimer);
                    window.location.href = "https://kick.com/popout/weizend/chat";
                }
            }, 1000);
        }

        function yonlendirmeyiIptalEt() {
            if(redirectTimer) clearInterval(redirectTimer);
            document.getElementById('redirectModal').style.display = 'none';
        }

        function kartIciResimDegistir(event, thumbElement, urunId, resimIndex, url) {
            event.stopPropagation(); 
            const card = thumbElement.closest('.card');
            const mainImg = card.querySelector('.main-card-img');
            const imgContainer = card.querySelector('.img-container');

            mainImg.src = url;
            imgContainer.dataset.currentIndex = resimIndex;

            card.querySelectorAll('.card-thumb').forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        function modaliAc(urunId, baslangicIndex) {
            const urun = URUNLER.find(u => u.orijinalId === urunId);
            if(!urun) return;

            aktifGorselListesi = urun.gorseller;
            aktifResimIndex = parseInt(baslangicIndex);
            
            document.getElementById('modalTitle').innerText = urun.ad;
            
            document.getElementById('prevBtn').style.display = aktifGorselListesi.length > 1 ? 'flex' : 'none';
            document.getElementById('nextBtn').style.display = aktifGorselListesi.length > 1 ? 'flex' : 'none';

            galeriyiGuncelle();
            document.getElementById('imageModal').style.display = 'flex';
        }

        function modaliKapat() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function disariTiklaKapat(event) {
            if (event.target.id === 'imageModal') {
                modaliKapat();
            }
        }

        function oncekiResim(event) {
            event.stopPropagation(); 
            aktifResimIndex--;
            if(aktifResimIndex < 0) aktifResimIndex = aktifGorselListesi.length - 1;
            galeriyiGuncelle();
        }

        function sonrakiResim(event) {
            event.stopPropagation(); 
            aktifResimIndex++;
            if(aktifResimIndex >= aktifGorselListesi.length) aktifResimIndex = 0;
            galeriyiGuncelle();
        }

        function modalResmeAtla(index) {
            aktifResimIndex = index;
            galeriyiGuncelle();
        }

        function galeriyiGuncelle() {
            document.getElementById('modalMainImg').src = aktifGorselListesi[aktifResimIndex];
            
            const thumbContainer = document.getElementById('modalThumbnails');
            thumbContainer.innerHTML = '';
            
            if(aktifGorselListesi.length > 1) {
                aktifGorselListesi.forEach((gorselUrl, i) => {
                    const aktifClass = i === aktifResimIndex ? 'active' : '';
                    thumbContainer.innerHTML += `<img src="${gorselUrl}" class="modal-thumb ${aktifClass}" onclick="modalResmeAtla(${i})">`;
                });
            }
        }

        function filtrele(kategori) {
            const butonlar = document.querySelectorAll('.filter-btn');
            butonlar.forEach(b => {
                if (b.innerText === kategori) b.classList.add('active');
                else b.classList.remove('active');
            });
            urunleriYukle(kategori);
        }

        urunleriYukle('Tümü');
    </script>
</body>
</html>
